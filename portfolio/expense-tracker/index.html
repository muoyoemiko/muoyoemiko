<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A mobile-friendly expense tracker demo for recording income, expenses, and budget summaries.">
  <title>Mobile Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="overview" aria-labelledby="app-title">
      <div class="topbar">
        <div>
          <p class="eyebrow">PocketBudget</p>
          <h1 id="app-title">Expense Tracker</h1>
        </div>
        <button class="icon-button" id="resetButton" type="button" aria-label="Clear all transactions" title="Clear all transactions">
          <span aria-hidden="true">Reset</span>
        </button>
      </div>

      <article class="balance-panel" aria-live="polite">
        <span>Current Balance</span>
        <strong id="balance">$0.00</strong>
      </article>

      <div class="summary-grid" aria-label="Income and expense summary">
        <article>
          <span>Income</span>
          <strong id="incomeTotal">$0.00</strong>
        </article>
        <article>
          <span>Expenses</span>
          <strong id="expenseTotal">$0.00</strong>
        </article>
      </div>
    </section>

    <section class="entry-panel" aria-labelledby="entry-title">
      <h2 id="entry-title">Add Transaction</h2>
      <form id="transactionForm">
        <label for="description">Description</label>
        <input id="description" name="description" type="text" placeholder="Groceries, paycheque, bus pass" required>

        <div class="field-row">
          <div>
            <label for="amount">Amount</label>
            <input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required>
          </div>
          <div>
            <label for="type">Type</label>
            <select id="type" name="type" required>
              <option value="expense">Expense</option>
              <option value="income">Income</option>
            </select>
          </div>
        </div>

        <label for="category">Category</label>
        <select id="category" name="category" required>
          <option value="Food">Food</option>
          <option value="Bills">Bills</option>
          <option value="Transport">Transport</option>
          <option value="Shopping">Shopping</option>
          <option value="Work">Work</option>
          <option value="Other">Other</option>
        </select>

        <button class="primary-button" type="submit">Add Transaction</button>
      </form>
    </section>

    <section class="insights-panel" aria-labelledby="insights-title">
      <div class="section-heading">
        <h2 id="insights-title">Category Summary</h2>
        <select id="categoryFilter" aria-label="Filter transactions by category">
          <option value="All">All</option>
          <option value="Food">Food</option>
          <option value="Bills">Bills</option>
          <option value="Transport">Transport</option>
          <option value="Shopping">Shopping</option>
          <option value="Work">Work</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div id="categorySummary" class="category-summary"></div>
    </section>

    <section class="transactions-panel" aria-labelledby="transactions-title">
      <h2 id="transactions-title">Recent Transactions</h2>
      <ul id="transactionList" class="transaction-list"></ul>
      <p id="emptyState" class="empty-state">No transactions yet. Add one to start tracking your budget.</p>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
